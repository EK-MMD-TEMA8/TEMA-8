<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find your recipe</title>
    <script src="javascript/listview.js" defer></script>
    <link rel="stylesheet" href="css/generel.css">
    <link rel="stylesheet" href="css/listview.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Arbutus+Slab&family=Figtree:wght@300..900&display=swap"
        rel="stylesheet" />

    <script src="javascript/header.js" defer></script>
    <script src="javascript/burger.js" defer></script>

</head>

<body>
    <header>
        <nav>
            <ul class="menu">
                <li>
                    <details>
                        <summary>Meals</summary>
                        <ul class="undermenu" id="mealMenu"></ul>
                    </details>
                </li>
                <li><a href="listview.html">Recipes</a></li>
                <li><a href="omos.html">About us</a></li>
            </ul>

            <a href="/">
                <img src="img/logo/logo.svg" alt="Blue Yum logo" />
            </a>

            <!-- Search field -->
            <form class="search" role="search">
                <img src="img/iconer/search-icon (1).svg" alt="Search icon" class="search-ikon" />
                <input type="search" placeholder="Search for a recipe" aria-label="Search for a recipe" />
            </form>

            <button class="burger">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
        </nav>
    </header>
    <main>
        <section class="filter-section">
            <h1>Find your next recipe</h1>
            <div class="filter-group">
                <h3>MEALS</h3>
                <div class="filter-buttons">
                    <button class="btn-tag" data-filter="mealType" data-value="All">ALL</button>
                    <button class="btn-tag" data-filter="mealType" data-value="Breakfast">BREAKFAST</button>
                    <button class="btn-tag" data-filter="mealType" data-value="Lunch">LUNCH</button>
                    <button class="btn-tag" data-filter="mealType" data-value="Dinner">DINNER</button>
                    <button class="btn-tag" data-filter="mealType" data-value="Dessert">DESSERT</button>
                    <button class="btn-tag" data-filter="mealType" data-value="Snack">SNACKS</button>
                </div>
            </div>
            <div class="filter-group">
                <h3>TIME</h3>
                <div class="filter-buttons">
                    <button class="btn-tag" data-filter="time" data-value="All">ALL</button>
                    <button class="btn-tag" data-filter="time" data-value="Under">Under 30 min</button>
                    <button class="btn-tag" data-filter="time" data-value="Over">Over 30 min</button>
                </div>
            </div>
            <div class="filter-group">
                <h3>CUISINE</h3>
                <!-- Køkkenerne bliver lavet i listview.js ud fra API'et -->
                <div class="filter-buttons" id="cuisineButtons">
                    <button class="btn-tag" data-filter="cuisine" data-value="All">ALL</button>
                </div>
            </div>
            <!-- Går tilbage til det filter, man havde valgt før -->
            <button class="btn-opdag back-btn" id="backButton" hidden>← Back</button>
        </section>
        <div class="separator"></div>
        <section class="intro-section">
            <h2 id="listTitle">ALL RECIPES</h2>
            <a> OUR NEWEST RECIPES:</a>
        </section>
        <section id="recipeContainer" class="recipe-grid">
        </section>
        <div class="button-wrapper">
            <button class="btn-opdag more-btn">See more</button>
        </div>
        <section class="kitchen-section">
            <h2>Do you dare to try a new cuisin?</h2>
            <div id="kitchenContainer" class="kitchen-grid">
                <img src="" alt="">
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-venstre">
            <img src="img/logo/logo.svg" alt="Yum logo" class="footer-logo">
            <p class="footer-find">Find os her</p>
            <div class="footer-ikoner">
                <a href="#"><img src="img/iconer/tiktok.png" alt="TikTok"></a>
                <a href="#"><img src="img/iconer/instagram.png" alt="Instagram"></a>
            </div>
        </div>
        <div class="footer-hoejre">
            <h2>Vil du modtage vores nyeste opskrifter før alle andre?</h2>
            <input type="email" class="footer-button1" placeholder="Ditnavn@gmail.com">
            <button class="footer-button2">Tilmeld dig her</button>
        </div>
    </footer>
</body>

</html>
