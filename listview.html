<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findyourrecipe</title>
    <script src="javascript/listview.js" defer></script>
    <link rel="stylesheet" href="css/generel.css">
    <link rel="stylesheet" href="css/listview.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Arbutus+Slab&family=Figtree:wght@300..900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <header>
        <nav>
            <ul class="menu">
                <li>
                    <details>
                        <summary>Måltider</summary>
                        <ul class="undermenu">
                            <li><a href="/listview?mealType=breakfast">Morgenmad</a></li>
                            <li><a href="/listview?mealType=lunch">Frokost</a></li>
                            <li><a href="/listview?mealType=dinner">Aftensmad</a></li>
                            <li><a href="/listview?mealType=dessert">Dessert</a></li>
                        </ul>
                    </details>
                </li>
                <li><a href="listview.html">Opskrifter</a></li>
                <li><a href="omos.html">Om os</a></li>
            </ul>
            <a href="/">
                <img src="img/logo/logo.svg" alt="blåt yum Logo" />
            </a>
            <!-- Søgefelt -->
            <form class="search" role="search">
                <img src="img/iconer/search-icon (1).svg" alt="søge icon" class="search-ikon" />
                <input type="search" placeholder="Søg efter opskrift" aria-label="Søg efter opskrift" />
            </form>
            <button class="burger">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
        </nav>
    </header>
    <main>
        <section class="filter-section">
            <h1>Find your next recipe</h1>
            <div class="filter-group">
                <h3>MEALS</h3>
                <div class="filter-buttons">
                    <button class="active">ALL</button>
                    <button>BREAKFAST</button>
                    <button>LUNCH</button>
                    <button>DINNER</button>
                    <button>DESSERT</button>
                    <button>SNACKS</button>
                </div>
            </div>
            <div class="filter-group">
                <h3>TIME</h3>
                <div class="filter-buttons">
                    <button>ALL</button>
                    <button>Under 30 min</button>
                    <button>Over 30 min</button>
                </div>
            </div>
            <div class="filter-group">
                <h3>CUISINE</h3>
                <div class="filter-buttons">
                    <button>ALL</button>
                    <button>FRANCE</button>
                    <button>MEXICAN</button>
                    <button>ITALIAN</button>
                    <button>ASIA</button>
                </div>
            </div>
        </section>
        <div class="separator"></div>
        <section class="intro-section">
            <h2>ALL RECIPES</h2>
            <a> OUR NEWEST RECIPES:</a>
        </section>
        <section id="recipeContainer" class="recipe-grid">
        </section>
        <div class="button-wrapper">
            <button class="more-btn">See more</button>
        </div>
        <section class="kitchen-section">
            <h2>Do you dare to try a new cuisin?</h2>
            <div id="kitchenContainer" class="kitchen-grid">
                <img src="" alt="">
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-venstre">
            <img src="img/logo/logo.svg" alt="Yum logo" class="footer-logo">
            <p class="footer-find">Find os her</p>
            <div class="footer-ikoner">
                <a href="#"><img src="img/iconer/tiktok.png" alt="TikTok"></a>
                <a href="#"><img src="img/iconer/instagram.png" alt="Instagram"></a>
            </div>
        </div>
        <div class="footer-hoejre">
            <h2>Vil du modtage vores nyeste opskrifter før alle andre?</h2>
            <input type="email" class="footer-button1" placeholder="Ditnavn@gmail.com">
            <button class="footer-button2">Tilmeld dig her</button>
        </div>
    </footer>
</body>

</html>
